name: fetch-nodes

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'fetch_nodes.py'
      - '.github/workflows/fetch_nodes.yml'
  schedule:
    # 北京时间每天早上 8:30 自动运行（比路径探测晚半小时，确保 proon_paths.txt 已更新）
    # 对应 UTC 时间 0:30
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-fetch-nodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4

      - name: 运行节点抓取与统计脚本
        run: |
          python fetch_nodes.py

      - name: 自动提交并推送统计 CSV 变动
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add node_stats.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update node statistics CSV [skip ci]" && git push)
